# Build and publish the documentation site to GitHub Pages.
#
# The site embeds the real LVGL UI compiled to WebAssembly and a Doxygen C API
# generated from the public headers.
name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'software/apps/cardsight/**'
      - 'software/tests/wasm/**'
      - 'software/tests/host/stubs/**'
      - 'software/src/gui/lv_conf.h'
      - 'software/include/**'
      - 'software/third_party/LVGL'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SUPPORT.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 1
      - name: Check out LVGL for the WebAssembly UI
        run: git submodule update --init software/third_party/LVGL
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1
          actions-cache-folder: emsdk-cache
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build the site, WebAssembly UI and C API
        working-directory: docs
        run: npm run build
      - name: Check links and generated API
        working-directory: docs
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
