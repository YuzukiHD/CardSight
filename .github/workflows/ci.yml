# Host tests and the documentation build.
#
# The cross build needs the Xuantie toolchain, which is not in this repository.
# Build it locally with `cmake --preset riscv` as described in the docs.
name: ci

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Check out the submodules the host build uses
        working-directory: .
        run: git submodule update --init software/third_party/fatfs software/third_party/lwext4 software/third_party/LVGL
      - name: Configure
        run: cmake --preset host
      - name: Build
        run: cmake --build build/host -j4
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  docs:
    # Master pushes are covered by the docs workflow, which also deploys.
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
      - name: Check out LVGL for the WebAssembly UI
        run: git submodule update --init software/third_party/LVGL
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.1
          actions-cache-folder: emsdk-cache
      - name: Install docs dependencies
        working-directory: docs
        run: npm ci
      - name: Build the docs site and the WebAssembly UI
        working-directory: docs
        run: npm run build
      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/dist
          if-no-files-found: error
